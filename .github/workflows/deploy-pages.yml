name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject bot token into config.js (build output only, never committed)
        run: |
          if ! grep -q '__GITHUB_BOT_TOKEN__' config.js; then
            echo "::error::config.js is missing the __GITHUB_BOT_TOKEN__ placeholder — refusing to deploy a real token would leak into git."
            exit 1
          fi
          sed -i "s|__GITHUB_BOT_TOKEN__|${GITHUB_BOT_TOKEN}|" config.js
        env:
          GITHUB_BOT_TOKEN: ${{ secrets.GITHUB_BOT_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
